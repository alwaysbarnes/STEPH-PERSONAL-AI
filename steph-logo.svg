<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Primary Linear Gradient (Pink to Blue) -->
    <linearGradient id="stephGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="stephAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGlow)"/>

  <!-- Outer Precision Ring -->
  <circle cx="60" cy="60" r="52" stroke="url(#stephGrad)" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.6"/>

  <!-- Inner Soft Ring -->
  <circle cx="60" cy="60" r="44" stroke="url(#stephAccent)" stroke-width="1.5" opacity="0.4"/>

  <!-- Stylized Futuristic 'S' & Neural Node Core -->
  <path d="M74 34 C64 26 44 26 38 38 C34 46 40 54 52 58 C66 63 74 68 70 80 C66 92 46 92 36 84" 
        stroke="url(#stephGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Complementary Cross-Swirl Curve -->
  <path d="M46 36 C52 42 66 48 76 56 C84 63 82 74 74 82" 
        stroke="url(#stephAccent)" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.8"/>

  <!-- Central Spark Nodes -->
  <circle cx="60" cy="60" r="3.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="38" cy="38" r="2.5" fill="#f472b6"/>
  <circle cx="70" cy="80" r="2.5" fill="#60a5fa"/>
  <circle cx="74" cy="34" r="2" fill="#ec4899"/>
  <circle cx="36" cy="84" r="2" fill="#3b82f6"/>
</svg>
